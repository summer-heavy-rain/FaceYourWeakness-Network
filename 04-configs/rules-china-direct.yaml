# ============================================================
# 中国大陆直连规则集
# ============================================================
#
# 用途：作为 Clash rule-provider 使用，匹配中国大陆常用服务的域名/IP，
#       命中的流量走 DIRECT（直连），避免绕远走代理反而更慢。
#
# 使用方式（在 Clash 配置中）：
#   rule-providers:
#     china-direct-custom:
#       type: file
#       behavior: classical
#       path: ./rules-china-direct.yaml
#
#   rules:
#     - RULE-SET,china-direct-custom,DIRECT
#
# behavior 类型说明：
#   本文件使用 classical 格式（每行是完整的规则类型+匹配值），
#   这样可以混合使用 DOMAIN-SUFFIX、DOMAIN-KEYWORD、IP-CIDR 等不同规则类型。
#
# 维护建议：根据你的实际使用情况增删条目。不是所有人都用拼多多，
#           但你可能用 Gitee——按需调整。

