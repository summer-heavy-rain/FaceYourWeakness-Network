# ============================================================
# 局域网共享代理 — Mixin 配置
# ============================================================
#
# 用途：作为 Clash Verge 的 Mixin（Global Merge）使用，
#       让办公室同事能通过你的电脑访问代理。
#
# 使用方式：
#   Clash Verge → Profiles → Global Merge → 粘贴此内容
#   或新建一个 Merge 类型的 Profile，启用它
#
# 配合文档：00-emergency/office-sharing.md 有完整的操作指南
#
# ============================================================
# 注意事项（重要！先读完再用）
# ============================================================
#
# 1. 安全性：allow-lan 打开后，同一局域网内任何人都能用你的代理。
#    下班回家、去咖啡厅、换网络时，务必关掉或禁用此 Profile。
#
# 2. 隐私：你的 Clash 日志能看到所有经过代理的请求的域名（HTTPS 下只有 SNI）。
#    告知同事这一点，避免信任问题。
#
# 3. 带宽：所有人共享你的上行带宽。提醒同事不要用代理看视频、下载大文件。
#
# 4. Windows 防火墙：这是最常被遗忘的一步！Clash 配置没问题但同事连不上，
#    99% 是防火墙挡了。必须放行 mixed-port 的入站 TCP 连接。
#    以管理员身份运行 PowerShell，执行：
#
#    New-NetFirewallRule -DisplayName "Clash Verge LAN" -Direction Inbound -Protocol TCP -LocalPort 7897 -Action Allow
#
#    或者去"Windows Defender 防火墙" → 高级设置 → 入站规则 → 新建规则 → 端口 → TCP 7897 → 允许
#
# 5. IP 变化：办公室 DHCP 可能给你分配不同的 IP。
#    最好去路由器管理页面给你的 MAC 地址绑定固定 IP。
#    或者每次 IP 变了就通知同事更新。

# ============================================================
# Mixin 配置
# ============================================================

# 同时接受 HTTP 和 SOCKS5 的混合端口
# Clash Verge 默认就是 7897，这里显式写出来确保一致
mixed-port: 7897

# 允许局域网连接 —— 这是核心开关
# false = 只有本机能用代理（默认值）
# true = 局域网内其他设备也能连接
allow-lan: true

# 监听地址
# "*" = 监听所有网卡接口（推荐，省事）
# "192.168.1.42" = 只监听指定网卡（更安全，但换 IP 后要改）
# "0.0.0.0" = 等价于 "*"
bind-address: "*"

# ============================================================
# 认证（可选但推荐）
# ============================================================
#
# 默认情况下 Clash 的局域网代理没有认证 —— 任何知道你 IP:port 的人都能用。
# 如果办公室网络较大（几十人以上）或者你不想被蹭，可以开启认证。
#
# 注意：认证只对 HTTP 代理协议生效（HTTP Proxy Authentication）。
# SOCKS5 代理的认证机制不同，mihomo 对 SOCKS5 认证的支持有限。
# 实际操作中，同事用 HTTP 代理居多，所以 HTTP 认证通常够用。

# 方式一：简单用户名密码（取消注释即可启用）
# authentication:
#   - "user1:password123"     # 格式：用户名:密码
#   - "user2:password456"     # 可以设多组，每个同事一个账号
#   - "melt:sharepass"        # 建议用简单密码，反正只在局域网内

# 方式二：不设认证，但用防火墙限制来源 IP（适合固定座位的办公室）
# 在 Windows 防火墙规则里，把 RemoteAddress 限制为特定同事的 IP：
#
# New-NetFirewallRule -DisplayName "Clash Verge LAN" -Direction Inbound -Protocol TCP -LocalPort 7897 -Action Allow -RemoteAddress "192.168.1.10,192.168.1.11,192.168.1.12"

# ============================================================
# 同事端配置指南（可以直接复制发给同事）
# ============================================================
#
# === 你需要的信息 ===
# 代理地址：<你的局域网 IP>（问我要，或自己 ping 我的电脑名）
# 代理端口：7897
# 代理类型：HTTP（也支持 SOCKS5，但 HTTP 更通用）
# 如果设了认证：用户名和密码（问我要）
#
# === Windows 全局代理 ===
# 设置 → 网络和 Internet → 代理 → 手动设置代理
#   地址：192.168.1.42（替换为实际 IP）
#   端口：7897
#   打开开关
#
# 注意：全局代理会让你所有 HTTP 流量都走代理，包括国内网站。
# 如果只想代理特定应用，用下面的 per-app 配置。
#
# === Cursor / VS Code ===
# 在 settings.json 中添加：
#   {
#     "http.proxy": "http://192.168.1.42:7897",
#     "http.proxyStrictSSL": false
#   }
# 如果设了认证：
#   "http.proxy": "http://user1:password123@192.168.1.42:7897"
#
# === Git ===
#   git config --global http.proxy http://192.168.1.42:7897
#   git config --global https.proxy http://192.168.1.42:7897
#
# === npm ===
#   npm config set proxy http://192.168.1.42:7897
#   npm config set https-proxy http://192.168.1.42:7897
#
# === 终端临时使用（当前窗口有效） ===
# PowerShell:
#   $env:HTTP_PROXY = "http://192.168.1.42:7897"
#   $env:HTTPS_PROXY = "http://192.168.1.42:7897"
#
# Bash / Git Bash:
#   export HTTP_PROXY=http://192.168.1.42:7897
#   export HTTPS_PROXY=http://192.168.1.42:7897
#
# === 验证连通性 ===
# PowerShell:
#   Invoke-WebRequest -Proxy "http://192.168.1.42:7897" -Uri "https://www.google.com"
# Bash:
#   curl -x http://192.168.1.42:7897 https://www.google.com
#
# 看到 HTML 内容就说明成功了。
#
# === 速度慢？ ===
# 1. 提醒我切换代理节点
# 2. 不要用代理下载大文件或看视频
# 3. 国内网站（百度、淘宝等）不要走代理，走代理反而更慢
